server {
    listen 80;

    # The built React app: plain static files.
    root /usr/share/nginx/html;
    index index.html;

    # Anything under /api goes to the Go dashboard-api. Same origin for the
    # browser, so no CORS issues in production.
    location /api/ {
        proxy_pass http://dashboard-api:8006;
    }

    location / {
        try_files $uri /index.html;
    }
}
